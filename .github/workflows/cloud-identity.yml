name: Approved development cloud identity check
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  identity:
    if: vars.AWS_ROLE_ARN != ''
    environment: development-cloud
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - run: aws sts get-caller-identity --query Arn --output text
