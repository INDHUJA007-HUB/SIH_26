[project]
name = "aicte-evidence-workbench"
version = "0.1.0"
description = "AICTE PS26261 evidence workbench backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<2.1", # OpenTelemetry's SQLAlchemy adapter currently supports <2.1.
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "boto3>=1.36,<2",
    "temporalio>=1.9,<2",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1",
    "pypdf>=6.21.2,<7",
    "pypdfium2>=5.14,<6",
    "pillow>=13,<14",
    "pyhanko>=0.26,<1",
    "reportlab>=4.3,<5",
]

[project.scripts]
workbench = "workbench.cli:main"

[dependency-groups]
build = [
    "hatchling==1.28.0",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pyyaml>=6,<7",
    "types-pyyaml>=6,<7",
    "pip-audit>=2.8,<3",
    "cyclonedx-bom>=5,<8",
    "detect-secrets>=1.5,<2",
]
spikes = [
    "pypdf>=5,<7",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4.30,<6",
    "reportlab>=4.3,<5",
    "pyhanko>=0.26,<1",
    "pillow>=13,<14",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501", "E402"]
"tools/**" = ["S105", "S106", "E501", "E402", "S324"]
"migrations/versions/**" = ["E501"] # Versioned SQL, not Python layout.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/workbench"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "opentelemetry.instrumentation.*", "pypdfium2", "pypdfium2.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the local PostgreSQL or container platform"]

[tool.coverage.run]
source = ["workbench"]
omit = ["*/tools.py", "*/worker.py"]
