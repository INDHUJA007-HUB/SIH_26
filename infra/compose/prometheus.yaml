global:
  scrape_interval: 5s
scrape_configs:
  - job_name: workbench-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: workbench-outbox
    static_configs:
      - targets: ["outbox-relay:9100"]
  - job_name: workbench-scan
    static_configs:
      - targets: ["scan-worker:9100"]
  - job_name: workbench-reconciliation
    static_configs:
      - targets: ["reconcile-worker:9100"]
